<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS 3D Spatial Desktop</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
    {
      "imports": {
        "three": "./node_modules/three/build/three.module.js",
        "three/examples/jsm/controls/OrbitControls.js": "./node_modules/three/examples/jsm/controls/OrbitControls.js"
      }
    }
    </script>
    <script src="./node_modules/@mediapipe/hands/hands.js"></script>
    <script src="./node_modules/@tensorflow/tfjs-core/dist/tf-core.min.js"></script>
    <script src="./node_modules/@tensorflow/tfjs-backend-webgl/dist/tf-backend-webgl.min.js"></script>
    <script src="./node_modules/@tensorflow/tfjs-converter/dist/tf-converter.min.js"></script>
    <script src="./node_modules/@tensorflow-models/hand-pose-detection/dist/hand-pose-detection.min.js"></script>
</head>

<body>
    <div id="canvas-container"></div>

    <div id="hud-overlay">
        <div class="hud-header">
            <div class="hud-brand">
                <h1>JARVIS // SPATIAL OS</h1>
                <span class="hud-sub">HOLOGRAPHIC DESKTOP</span>
            </div>
            
            <div class="hud-controls">
                <button id="hand-toggle-btn" class="hud-btn" type="button" title="Cambia mano attiva (DX / SX) [Scorciatoia tastiera: H]">
                    <div class="hud-btn-content">
                        <svg class="hand-svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 11V6a2 2 0 0 0-4 0v4M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8a6 6 0 0 0 6 6h2a6 6 0 0 0 6-6v-3a2 2 0 0 0-4 0" />
                        </svg>
                        <span class="hud-btn-text">MANO:</span>
                        <div class="hand-selector">
                            <span id="hand-pill-dx" class="hand-pill active">DX</span>
                            <span class="hand-divider">/</span>
                            <span id="hand-pill-sx" class="hand-pill">SX</span>
                        </div>
                    </div>
                </button>
                <div id="status-indicator">SYSTEM READY</div>
            </div>
        </div>

        <div class="hud-footer">
            <div id="gesture-status">GESTURE: IDLE [DX]</div>
            <div id="fps-counter">FPS: 00</div>
        </div>
    </div>

    <div id="webcam-container">
        <div id="webcam-hud-label">CAM // <span id="webcam-hand-tag">MANO DX</span></div>
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <script src="renderer.js" type="module"></script>
</body>

</html>
